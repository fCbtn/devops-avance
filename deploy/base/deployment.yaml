apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Le secret n'existe qu'en dev (scellé dans l'overlay dev) ; en prod
            # il est absent, d'où optional: true pour ne pas bloquer le démarrage.
            - secretRef:
                name: api-secret
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
