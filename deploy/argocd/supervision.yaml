apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supervision
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.14.1
    helm:
      values: |
        # Prometheus doit prendre en compte nos PodMonitor et PrometheusRule,
        # qui n'ont pas le label "release" du chart.
        prometheus:
          prometheusSpec:
            podMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        # Le sidecar de Grafana charge les dashboards fournis en ConfigMap.
        grafana:
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              searchNamespace: ALL
  destination:
    server: https://kubernetes.default.svc
    namespace: supervision
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
